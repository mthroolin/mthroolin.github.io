name: Build and Deploy Jekyll Site

on:
  push:
    branches: ["main", "gh-pages", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Check out the repo
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Install Quarto
      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # 3. Install R
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.1'

      # 4. Install R package dependencies
      - name: Install R packages
        run: |
          # Install system dependencies commonly needed by R packages
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev
          # Check if renv.lock exists in the Quarto project and use it
          if [ -f "documents/BoosStefanskiQMD/renv.lock" ]; then
            Rscript -e 'install.packages("renv"); renv::restore(project = "documents/BoosStefanskiQMD")'
          else
            # Install common packages needed for Quarto rendering
            Rscript -e 'install.packages(c("knitr", "rmarkdown", "tidyverse", "ggplot2", "kableExtra", "numDeriv"), repos = "https://cloud.r-project.org")'
          fi

      # 5. Render the Boos & Stefanski Quarto project to HTML
      - name: Render Boos and Stefanski QMD
        run: |
          cd documents/BoosStefanskiQMD
          quarto render --output-dir _output
          cd ../..
          # Copy rendered output to a directory Jekyll will include
          # (Jekyll ignores dirs starting with underscore)
          mkdir -p documents/BoosStefanski
          cp -r documents/BoosStefanskiQMD/_output/* documents/BoosStefanski/

      # 6. Setup Ruby and install gems (for jekyll-scholar, etc.)
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      # 7. Configure GitHub Pages
      - name: Configure Pages
        uses: actions/configure-pages@v5

      # 8. Build the Jekyll site
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl ""
        env:
          JEKYLL_ENV: production

      # 9. Upload the built site as a Pages artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build_and_deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
