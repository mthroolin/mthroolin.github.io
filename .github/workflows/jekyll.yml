name: Build and Deploy Jekyll Site

on:
  push:
    branches: ["main", "gh-pages", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Check out the repo (with fetch-depth 2 to detect changes)
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # 2. Detect if BoosStefanskiQMD folder has changes
      - name: Check for BoosStefanskiQMD changes
        id: check_boosstefanski
        run: |
          if git diff --name-only HEAD~1 HEAD -- 'documents/BoosStefanskiQMD/' | grep -q .; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      # 3. Install Quarto
      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # 4. Install R (only if BoosStefanskiQMD changed)
      - name: Setup R
        if: steps.check_boosstefanski.outputs.changed == 'true'
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.1'

      # 5. Install R package dependencies (only if BoosStefanskiQMD changed)
      - name: Install R packages
        if: steps.check_boosstefanski.outputs.changed == 'true'
        run: |
          # Install system dependencies commonly needed by R packages
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev
          # Check if renv.lock exists in the Quarto project and use it
          if [ -f "documents/BoosStefanskiQMD/renv.lock" ]; then
            Rscript -e 'install.packages("renv"); renv::restore(project = "documents/BoosStefanskiQMD")'
          else
            # Install common packages needed for Quarto rendering
            Rscript -e 'install.packages(c("kableExtra", "numDeriv"), repos = "https://cloud.r-project.org")'
          fi

      # 6. Render the Boos & Stefanski Quarto project to HTML (only if BoosStefanskiQMD changed)
      - name: Render Boos and Stefanski QMD
        if: steps.check_boosstefanski.outputs.changed == 'true'
        run: |
          cd documents/BoosStefanskiQMD
          quarto render --output-dir _output
          cd ../..
          # Copy rendered output to a directory Jekyll will include
          # (Jekyll ignores dirs starting with underscore)
          mkdir -p documents/BoosStefanski
          cp -r documents/BoosStefanskiQMD/_output/* documents/BoosStefanski/

      # 7. Setup Ruby and install gems (for jekyll-scholar, etc.)
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      # 8. Configure GitHub Pages
      - name: Configure Pages
        uses: actions/configure-pages@v5

      # 9. Build the Jekyll site
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl ""
        env:
          JEKYLL_ENV: production

      # 10. Upload the built site as a Pages artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build_and_deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
